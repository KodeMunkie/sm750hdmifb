# SPDX-License-Identifier: GPL-2.0-only
name: Manual DKMS build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Attach artifacts to an existing release tag
        required: true
        type: boolean
        default: false
      release_tag:
        description: Existing release tag, for example v0.5.1
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          headers_package=$(apt-cache search --names-only '^linux-headers-6\.17\.[0-9]+-[0-9]+-generic$' | awk '{print $1}' | sort -V | tail -1)
          test -n "$headers_package"
          sudo apt-get install -y build-essential dkms "$headers_package" libdrm-dev ripgrep

      - name: Select Ubuntu kernel headers
        id: headers
        run: |
          headers=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-6.17.*-generic' | sort -V | tail -1)
          test -n "$headers"
          echo "path=$headers" >>"$GITHUB_OUTPUT"

      - name: Build and test
        run: make KDIR="${{ steps.headers.outputs.path }}" check

      - name: Build and audit package
        run: |
          ./build-package.sh
          ./tests/audit-release.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sm750hdmifb-0.5.5
          path: |
            dist/sm750hdmifb_0.5.5_all.deb
            dist/sm750hdmifb-0.5.5-source.tar.gz
            dist/SHA256SUMS
            dist/RELEASE-AUDIT.txt

      - name: Attach to existing GitHub release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test -n "$RELEASE_TAG"
          gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" --clobber \
            dist/sm750hdmifb_0.5.5_all.deb \
            dist/sm750hdmifb-0.5.5-source.tar.gz \
            dist/SHA256SUMS \
            dist/RELEASE-AUDIT.txt
